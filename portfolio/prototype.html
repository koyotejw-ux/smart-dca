<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 물타기 계산기 (Smart DCA Calculator) - Live Mockup Phone Simulator</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #0d1527 0%, #080b11 60%, #030508 100%);
      color: #E2E8F0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Floating Glassmorphism Navigation Bar */
    .proto-navbar {
      width: 100%;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(13, 21, 39, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      flex-shrink: 0;
    }

    .proto-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back-deck {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #E2E8F0;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-deck:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.45);
      color: #00D2FF;
      transform: translateX(-2px);
    }

    .proto-brand {
      font-size: 14px;
      font-weight: 800;
      color: #94A3B8;
      letter-spacing: -0.01em;
    }

    .proto-brand strong {
      color: #FFFFFF;
    }

    /* Center Flow Segment Switcher Pills */
    .flow-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      padding: 4px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .flow-pill {
      background: transparent;
      border: 1px solid transparent;
      color: #94A3B8;
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }

    .flow-pill .flow-num {
      font-size: 10.5px;
      font-weight: 800;
      opacity: 0.65;
    }

    .flow-pill:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .flow-pill.active {
      background: linear-gradient(135deg, #0057FF, #00D2FF);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 2px 12px rgba(0, 210, 255, 0.35);
    }

    .flow-pill.active .flow-num {
      opacity: 0.9;
    }

    /* Right Quick Actions */
    .proto-nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #00E676;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 9999px;
    }

    .status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #00E676;
      box-shadow: 0 0 8px #00E676;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-icon-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
    }

    /* Device Center Stage: Zero Document Clutter */
    .device-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 12px 20px;
    }

    /* Ambient Lighting Behind Mockup */
    .device-stage::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 720px;
      background: radial-gradient(circle, rgba(0, 110, 255, 0.22) 0%, rgba(0, 210, 255, 0.08) 45%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
    }

    /* Authentic Smartphone Chassis */
    .phone-chassis {
      position: relative;
      z-index: 10;
      width: 390px;
      max-width: 90vw;
      height: min(844px, calc(100vh - 100px));
      aspect-ratio: 390 / 844;
      background: #000000;
      border: 11px solid #1E232E;
      border-radius: 52px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 45px rgba(0, 87, 255, 0.25);
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Side Hardware Buttons via Pseudo-elements */
    .phone-chassis::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 100px;
      width: 3px;
      height: 24px;
      background: #334155;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 42px 0 #334155, 0 88px 0 #334155;
    }

    .phone-chassis::after {
      content: '';
      position: absolute;
      right: -14px;
      top: 145px;
      width: 3px;
      height: 48px;
      background: #334155;
      border-radius: 0 2px 2px 0;
    }

    /* Dynamic Island at Top */
    .phone-dynamic-island {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      pointer-events: none;
      background: #000000;
      padding: 3px 14px;
      border-radius: 20px;
    }

    .island-speaker {
      width: 44px;
      height: 4px;
      background: #27272A;
      border-radius: 2px;
    }

    .island-cam {
      width: 8px;
      height: 8px;
      background: #09090B;
      border: 1.5px solid #1E293B;
      border-radius: 50%;
    }

    /* Live Flutter Web App Iframe */
    .flutter-app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 40px;
      background: #05070B;
      display: block;
      z-index: 10;
    }

    /* Subtle Floating Bottom Hint */
    .device-caption-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 11.5px;
      color: #94A3B8;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 16px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .device-caption-hint strong {
      color: #00D2FF;
    }

    /* Desktop Label vs Mobile Label Defaults */
    .flow-pill .desktop-label {
      display: inline;
    }
    .flow-pill .mobile-label {
      display: none;
    }
    .btn-back-deck .btn-back-label-desktop {
      display: inline;
    }
    .btn-back-deck .btn-back-label-mobile {
      display: none;
    }
    .btn-icon-action .btn-label {
      display: inline;
    }

    /* ==============================================================
       MOBILE RESPONSIVE BREAKPOINT (max-width: 768px)
       Transforms phone mockup into 100% native mobile app screen
       ============================================================== */
    @media (max-width: 768px) {
      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      /* Compact, Sleek Mobile Top Navigation (46px) */
      .proto-navbar {
        height: 46px;
        padding: 0 10px;
        gap: 6px;
        background: rgba(11, 15, 23, 0.96);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .proto-brand,
      .live-status-pill,
      #btn-fullscreen-app {
        display: none !important;
      }

      .btn-back-deck {
        padding: 5px 8px;
        font-size: 11px;
        gap: 4px;
        flex-shrink: 0;
      }
      .btn-back-deck .btn-back-label-desktop {
        display: none !important;
      }
      .btn-back-deck .btn-back-label-mobile {
        display: inline !important;
      }

      /* Flow Pills: Compact Mobile Touch Tabs */
      .flow-pill-group {
        gap: 3px;
        padding: 2px 4px;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        flex: 1;
        justify-content: center;
        max-width: calc(100vw - 110px);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .flow-pill-group::-webkit-scrollbar {
        display: none;
      }

      .flow-pill {
        padding: 5px 8px;
        font-size: 11px;
        gap: 3px;
        white-space: nowrap;
        border-radius: 9999px;
      }
      .flow-pill .flow-num {
        font-size: 9px;
        font-weight: 800;
      }
      .flow-pill .desktop-label {
        display: none !important;
      }
      .flow-pill .mobile-label {
        display: inline !important;
      }

      .btn-icon-action {
        padding: 6px;
        font-size: 11px;
        flex-shrink: 0;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-icon-action .btn-label {
        display: none !important;
      }

      /* Transform Device Stage into 100% Native Full-Screen Mobile App */
      .device-stage {
        padding: 0 !important;
        margin: 0 !important;
        width: 100vw !important;
        height: calc(100vh - 46px) !important;
        height: calc(100dvh - 46px) !important;
        max-height: calc(100dvh - 46px) !important;
        background: #000000 !important;
        overflow: hidden !important;
      }
      .device-stage::before {
        display: none !important; /* Hide ambient glow on mobile */
      }

      .phone-chassis {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        aspect-ratio: auto !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #000000 !important;
      }
      .phone-chassis::before,
      .phone-chassis::after {
        display: none !important; /* Hide simulated hardware buttons on mobile */
      }

      .phone-dynamic-island {
        display: none !important; /* Physical phone already has camera/cutout */
      }

      .flutter-app-iframe {
        border-radius: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }

      .device-caption-hint {
        display: none !important; /* Remove hint to prevent covering bottom nav */
      }
    }
  </style>
</head>
<body>

  <!-- Top Floating Minimal Navigation & Section Switcher -->
  <header class="proto-navbar">
    <div class="proto-nav-left">
      <a href="index.html#slide-12" class="btn-back-deck">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span class="btn-back-label-desktop">포트폴리오로 돌아가기</span>
        <span class="btn-back-label-mobile">포트폴리오</span>
      </a>
      <div class="proto-brand">
        <strong>스마트 물타기 계산기</strong> · 모바일 목업 테스터
      </div>
    </div>

    <!-- Center Flow Segment Switcher: 4 Core Sections -->
    <nav class="flow-pill-group" aria-label="테스트 구간 선택">
      <button class="flow-pill active" data-flow="home" id="pill-home" title="01. 자산 현황 진단">
        <span class="flow-num">01</span>
        <span class="desktop-label">자산 진단</span>
        <span class="mobile-label">진단</span>
      </button>
      <button class="flow-pill" data-flow="voice" id="pill-voice" title="02. 0.2초 음성 도크">
        <span class="flow-num">02</span>
        <span class="desktop-label">0.2초 음성 도크</span>
        <span class="mobile-label">음성</span>
      </button>
      <button class="flow-pill" data-flow="target" id="pill-target" title="03. 목표 평단가 역산 엔진">
        <span class="flow-num">03</span>
        <span class="desktop-label">목표 역산 엔진</span>
        <span class="mobile-label">역산</span>
      </button>
      <button class="flow-pill" data-flow="sim" id="pill-sim" title="04. 최종 플랜 확정 & 안전 진단">
        <span class="flow-num">04</span>
        <span class="desktop-label">최종 플랜 확정</span>
        <span class="mobile-label">플랜</span>
      </button>
    </nav>

    <!-- Right Quick Actions -->
    <div class="proto-nav-right">
      <span class="live-status-pill">
        <span class="status-dot"></span>
        Flutter Web 60fps
      </span>
      <button class="btn-icon-action" id="btn-reload" title="현재 화면 새로고침">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span class="btn-label">새로고침</span>
      </button>
      <a href="app/index.html" target="_blank" class="btn-icon-action" id="btn-fullscreen-app" title="실제 앱 브라우저 새 창에서 열기">
        새 탭 ↗
      </a>
    </div>
  </header>

  <!-- Main Viewport: Centered Mockup Phone Device -->
  <main class="device-stage">
    
    <div class="phone-chassis" id="phone-chassis">
      
      <!-- Speaker & Dynamic Island -->
      <div class="phone-dynamic-island">
        <div class="island-speaker"></div>
        <div class="island-cam"></div>
      </div>

      <!-- Real Flutter Web App Iframe -->
      <iframe 
        id="flutter-frame" 
        class="flutter-app-iframe" 
        src="app/index.html?flow=home" 
        allow="microphone" 
        title="Smart DCA Live Interactive Mobile Device">
      </iframe>

    </div>

    <!-- Subtle Floating Bottom Helper Hint -->
    <div class="device-caption-hint">
      📱 화면 속 버튼 및 키패드를 직접 터치/클릭하여 <strong>실제 플러터 앱</strong>을 조작하세요.
    </div>

  </main>

  <script>
    (function() {
      const pills = Array.from(document.querySelectorAll('.flow-pill'));
      const iframe = document.getElementById('flutter-frame');
      const btnReload = document.getElementById('btn-reload');
      const btnFullscreenApp = document.getElementById('btn-fullscreen-app');

      // Valid flows mapping
      const validFlows = ['home', 'voice', 'target', 'sim'];

      // Function to switch flow
      function setFlow(flow, updateUrl = true) {
        if (!validFlows.includes(flow)) flow = 'home';

        pills.forEach(pill => {
          pill.classList.toggle('active', pill.getAttribute('data-flow') === flow);
        });

        const targetUrl = 'app/index.html?flow=' + flow;
        iframe.src = targetUrl;

        if (btnFullscreenApp) {
          btnFullscreenApp.href = targetUrl;
        }

        if (updateUrl) {
          const currentUrl = new URL(window.location);
          currentUrl.searchParams.set('flow', flow);
          window.history.replaceState({}, '', currentUrl.toString());
        }
      }

      // Check URL search parameters on initial load
      const urlParams = new URLSearchParams(window.location.search);
      const initialFlow = urlParams.get('flow') || 'home';
      setFlow(initialFlow, false);

      // Add click listeners to switcher pills
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          const flow = pill.getAttribute('data-flow');
          setFlow(flow, true);
        });
      });

      // Reload iframe button
      if (btnReload) {
        btnReload.addEventListener('click', () => {
          iframe.src = iframe.src;
        });
      }
    })();
  </script>
</body>
</html>
