<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B0F17">
  <title>스마트 물타기 계산기 (Smart DCA Calculator) - Live Mockup Phone Simulator</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --device-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #0d1527 0%, #080b11 60%, #030508 100%);
      color: #E2E8F0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Floating Glassmorphism Navigation Bar */
    .proto-navbar {
      width: 100%;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(13, 21, 39, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      flex-shrink: 0;
    }

    .proto-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back-deck {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #E2E8F0;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back-deck:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.45);
      color: #00D2FF;
      transform: translateX(-2px);
    }

    .proto-brand {
      font-size: 14px;
      font-weight: 800;
      color: #94A3B8;
      letter-spacing: -0.01em;
    }

    .proto-brand strong {
      color: #FFFFFF;
    }

    /* Center Flow Segment Switcher Pills */
    .flow-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      padding: 4px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .flow-pill {
      background: transparent;
      border: 1px solid transparent;
      color: #94A3B8;
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }

    .flow-pill .flow-num {
      font-size: 10.5px;
      font-weight: 800;
      opacity: 0.65;
    }

    .flow-pill:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .flow-pill.active {
      background: linear-gradient(135deg, #0057FF, #00D2FF);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 2px 12px rgba(0, 210, 255, 0.35);
    }

    .flow-pill.active .flow-num {
      opacity: 0.9;
    }

    /* Right Quick Actions */
    .proto-nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #00E676;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 9999px;
    }

    .status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #00E676;
      box-shadow: 0 0 8px #00E676;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-icon-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
    }

    /* Device Center Stage: Zero Document Clutter & Height Resilient */
    .device-stage {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      height: calc(100dvh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 0;
      box-sizing: border-box;
    }

    /* Ambient Lighting Behind Mockup */
    .device-stage::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 720px;
      background: radial-gradient(circle, rgba(0, 110, 255, 0.22) 0%, rgba(0, 210, 255, 0.08) 45%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
    }

    /* Authentic Smartphone Chassis (Scaled dynamically to fit browser height) */
    .phone-chassis {
      position: relative;
      z-index: 10;
      width: 412px;
      height: 866px;
      min-width: 412px;
      min-height: 866px;
      max-width: 412px;
      max-height: 866px;
      background: #000000;
      border: 11px solid #1E232E;
      border-radius: 54px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 45px rgba(0, 87, 255, 0.25);
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transform: scale(var(--device-scale, 1));
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.08s ease-out;
    }

    /* Side Hardware Buttons via Pseudo-elements */
    .phone-chassis::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 100px;
      width: 3px;
      height: 24px;
      background: #334155;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 42px 0 #334155, 0 88px 0 #334155;
    }

    .phone-chassis::after {
      content: '';
      position: absolute;
      right: -14px;
      top: 145px;
      width: 3px;
      height: 48px;
      background: #334155;
      border-radius: 0 2px 2px 0;
    }

    /* Authentic Smartphone Status Bar (44px) */
    .phone-status-bar {
      width: 100%;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      background: #0B0F17;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      z-index: 50;
      position: relative;
      flex-shrink: 0;
      border-top-left-radius: 43px;
      border-top-right-radius: 43px;
      box-sizing: border-box;
      user-select: none;
    }

    .status-left {
      display: flex;
      align-items: center;
      width: 60px;
    }

    .status-time {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      font-feature-settings: "tnum";
      color: #FFFFFF;
    }

    .status-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .dynamic-island {
      width: 110px;
      height: 28px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      gap: 8px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .island-camera {
      width: 10px;
      height: 10px;
      background: #09090b;
      border: 1.5px solid #1c2128;
      border-radius: 50%;
      box-shadow: inset 0 0 2px #0057ff;
    }

    .island-sensor {
      width: 6px;
      height: 6px;
      background: #05070a;
      border-radius: 50%;
    }

    .status-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      width: 60px;
      color: #FFFFFF;
    }

    .status-icon {
      color: #FFFFFF;
      display: block;
      flex-shrink: 0;
    }

    .status-battery {
      display: flex;
      align-items: center;
      gap: 1.5px;
    }

    .battery-pill {
      width: 22px;
      height: 11px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 3.5px;
      padding: 1.5px;
      display: flex;
      align-items: center;
    }

    .battery-charge {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 1px;
    }

    .battery-tip {
      width: 1.5px;
      height: 4px;
      background: rgba(255, 255, 255, 0.7);
      border-top-right-radius: 1px;
      border-bottom-right-radius: 1px;
    }

    /* Live Interactive Prototype Frame */
    .flutter-app-iframe {
      width: 100%;
      height: 800px;
      flex: 1;
      border: none;
      border-bottom-left-radius: 43px;
      border-bottom-right-radius: 43px;
      background: #0B0F17;
      display: block;
      z-index: 10;
    }

    /* Subtle Floating Bottom Hint */
    .device-caption-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 11.5px;
      color: #94A3B8;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 16px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .device-caption-hint strong {
      color: #00D2FF;
    }

    /* Desktop Label vs Mobile Label Defaults */
    .flow-pill .desktop-label {
      display: inline;
    }
    .flow-pill .mobile-label {
      display: none;
    }
    .btn-back-deck .btn-back-label-desktop {
      display: inline;
    }
    .btn-back-deck .btn-back-label-mobile {
      display: none;
    }
    .btn-icon-action .btn-label {
      display: inline;
    }

    /* ==============================================================
       MOBILE RESPONSIVE BREAKPOINT (max-width: 768px)
       Transforms phone mockup into 100% native mobile app screen
       ============================================================== */
    @media (max-width: 768px) {
      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Compact, Sleek Mobile Top Navigation with Notch Clearance */
      .proto-navbar {
        height: auto;
        min-height: calc(46px + var(--sat));
        padding-top: max(6px, var(--sat));
        padding-bottom: 6px;
        padding-left: max(8px, var(--sal));
        padding-right: max(8px, var(--sar));
        gap: 4px;
        background: rgba(11, 15, 23, 0.98);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .proto-brand,
      .live-status-pill {
        display: none !important;
      }

      .btn-back-deck {
        height: 32px;
        padding: 0 8px;
        font-size: 11px;
        gap: 3px;
        flex-shrink: 0;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-back-deck .btn-back-label-desktop {
        display: none !important;
      }
      .btn-back-deck .btn-back-label-mobile {
        display: inline !important;
      }

      /* Flow Pills: Touch-optimized horizontally scrollable tabs */
      .flow-pill-group {
        gap: 2px;
        padding: 2px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        touch-action: pan-x;
      }
      .flow-pill-group::-webkit-scrollbar {
        display: none;
      }

      .flow-pill {
        min-height: 30px;
        padding: 4px 7px;
        font-size: 11px;
        font-weight: 700;
        gap: 2px;
        white-space: nowrap;
        border-radius: 9999px;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
      }
      .flow-pill .flow-num {
        font-size: 9.5px;
        font-weight: 800;
      }
      .flow-pill .desktop-label {
        display: none !important;
      }
      .flow-pill .mobile-label {
        display: inline !important;
      }

      .proto-nav-right {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .btn-icon-action {
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 11px;
        flex-shrink: 0;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-icon-action .btn-label {
        display: none !important;
      }

      #btn-fullscreen-app {
        display: inline-flex !important;
      }

      /* Transform Device Stage into 100% Native Full-Screen Mobile App */
      .device-stage {
        padding: 0 !important;
        margin: 0 !important;
        width: 100vw !important;
        height: calc(100vh - 46px - var(--sat) - var(--sab)) !important;
        height: calc(100dvh - 46px - var(--sat) - var(--sab)) !important;
        max-height: calc(100dvh - 46px - var(--sat) - var(--sab)) !important;
        padding-bottom: var(--sab) !important;
        background: #0B0F17 !important;
        overflow: hidden !important;
        box-sizing: border-box;
      }
      .device-stage::before {
        display: none !important; /* Hide ambient glow on mobile */
      }

      .phone-status-bar {
        display: none !important; /* Real device already has native OS status bar */
      }

      .phone-chassis {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        min-width: 0 !important;
        min-height: 0 !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #0B0F17 !important;
        transform: none !important;
      }
      .phone-chassis::before,
      .phone-chassis::after {
        display: none !important; /* Hide simulated hardware buttons on mobile */
      }

      .phone-dynamic-island {
        display: none !important; /* Physical phone already has camera/cutout */
      }

      .flutter-app-iframe {
        border-radius: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        background: #0B0F17 !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
      }

      .device-caption-hint {
        display: none !important; /* Remove hint to prevent covering bottom nav */
      }
    }

    /* Auto-hide caption hint on small desktop window heights to prioritize mockup */
    @media (max-height: 640px) {
      .device-caption-hint {
        display: none !important;
      }
    }

    /* Extra Narrow Mobile Screens (<= 380px, e.g. iPhone SE / Galaxy Z Flip) */
    @media (max-width: 380px) {
      .btn-back-deck {
        padding: 0 7px;
        font-size: 10.5px;
      }
      .flow-pill-group {
        justify-content: flex-start;
        padding: 2px;
      }
      .flow-pill {
        padding: 4px 6px;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Floating Minimal Navigation & Section Switcher -->
  <header class="proto-navbar">
    <div class="proto-nav-left">
      <a href="index.html#slide-12" class="btn-back-deck">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span class="btn-back-label-desktop">포트폴리오로 돌아가기</span>
        <span class="btn-back-label-mobile">홈</span>
      </a>
      <div class="proto-brand">
        <strong>스마트 물타기 계산기</strong> · 모바일 목업 테스터
      </div>
    </div>

    <!-- Center Flow Segment Switcher: 4 Core Sections -->
    <nav class="flow-pill-group" aria-label="테스트 구간 선택">
      <button class="flow-pill active" data-flow="home" id="pill-home" title="01. 자산 현황 진단">
        <span class="desktop-label"><span class="flow-num">01</span> 자산 진단</span>
        <span class="mobile-label"><span class="flow-num">1</span>진단</span>
      </button>
      <button class="flow-pill" data-flow="voice" id="pill-voice" title="02. 0.2초 음성 도크">
        <span class="desktop-label"><span class="flow-num">02</span> 0.2초 음성 도크</span>
        <span class="mobile-label"><span class="flow-num">2</span>음성</span>
      </button>
      <button class="flow-pill" data-flow="target" id="pill-target" title="03. 목표 평단가 역산 엔진">
        <span class="desktop-label"><span class="flow-num">03</span> 목표 역산 엔진</span>
        <span class="mobile-label"><span class="flow-num">3</span>역산</span>
      </button>
      <button class="flow-pill" data-flow="sim" id="pill-sim" title="04. 최종 플랜 확정 & 안전 진단">
        <span class="desktop-label"><span class="flow-num">04</span> 최종 플랜 확정</span>
        <span class="mobile-label"><span class="flow-num">4</span>플랜</span>
      </button>
    </nav>

    <!-- Right Quick Actions -->
    <div class="proto-nav-right">
      <span class="live-status-pill">
        <span class="status-dot"></span>
        Interactive 60fps
      </span>
      <button class="btn-icon-action" id="btn-reload" title="현재 화면 새로고침">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span class="btn-label">새로고침</span>
      </button>
      <a href="app/index.html" target="_blank" class="btn-icon-action" id="btn-fullscreen-app" title="프로토타입 새 창에서 전체화면으로 열기" aria-label="새 탭에서 프로토타입 열기">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        <span class="btn-label">새 탭 ↗</span>
      </a>
    </div>
  </header>

  <!-- Main Viewport: Centered Mockup Phone Device -->
  <main class="device-stage">
    
    <div class="phone-chassis" id="phone-chassis">
      
      <!-- Authentic Flagship Status Bar (44px) -->
      <div class="phone-status-bar" id="phone-status-bar">
        <div class="status-left">
          <span class="status-time" id="status-live-time">9:41</span>
        </div>
        <div class="status-center">
          <div class="dynamic-island">
            <div class="island-camera"></div>
            <div class="island-sensor"></div>
          </div>
        </div>
        <div class="status-right">
          <!-- Cellular 4-Bar Signal -->
          <svg class="status-icon" width="17" height="12" viewBox="0 0 17 12" fill="none" aria-hidden="true">
            <rect x="0.5" y="8.5" width="2.5" height="3" rx="0.6" fill="currentColor"/>
            <rect x="4.5" y="6" width="2.5" height="5.5" rx="0.6" fill="currentColor"/>
            <rect x="8.5" y="3.5" width="2.5" height="8" rx="0.6" fill="currentColor"/>
            <rect x="12.5" y="0.5" width="2.5" height="11" rx="0.6" fill="currentColor"/>
          </svg>
          <!-- Wi-Fi -->
          <svg class="status-icon" width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
            <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-3.8-2.6a5.4 5.4 0 0 1 7.6 0 .75.75 0 0 1-1.06 1.06 3.9 3.9 0 0 0-5.48 0 .75.75 0 0 1-1.06-1.06zm-2.8-2.8a9.4 9.4 0 0 1 13.2 0 .75.75 0 1 1-1.06 1.06 7.9 7.9 0 0 0-11.08 0 .75.75 0 1 1-1.06-1.06z"/>
          </svg>
          <!-- Battery -->
          <div class="status-battery" aria-label="배터리 100%">
            <div class="battery-pill">
              <div class="battery-charge"></div>
            </div>
            <div class="battery-tip"></div>
          </div>
        </div>
      </div>

      <!-- Real Interactive Prototype Iframe -->
      <iframe 
        id="flutter-frame" 
        class="flutter-app-iframe" 
        src="app/index.html?flow=home" 
        allow="microphone" 
        title="Smart DCA Live Interactive Mobile Prototype">
      </iframe>

    </div>

    <!-- Subtle Floating Bottom Helper Hint -->
    <div class="device-caption-hint">
      📱 화면 속 버튼 및 키패드를 직접 터치/클릭하여 <strong>인터랙티브 프로토타입</strong>을 직접 조작하세요.
    </div>

  </main>

  <script>
    (function() {
      const pills = Array.from(document.querySelectorAll('.flow-pill'));
      const iframe = document.getElementById('flutter-frame');
      const btnReload = document.getElementById('btn-reload');
      const btnFullscreenApp = document.getElementById('btn-fullscreen-app');

      // Valid flows mapping
      const validFlows = ['home', 'voice', 'target', 'sim'];

      // Function to switch flow
      function setFlow(flow, updateUrl = true) {
        if (!validFlows.includes(flow)) flow = 'home';

        pills.forEach(pill => {
          pill.classList.toggle('active', pill.getAttribute('data-flow') === flow);
        });

        const targetUrl = 'app/index.html?flow=' + flow;
        iframe.src = targetUrl;

        if (btnFullscreenApp) {
          btnFullscreenApp.href = targetUrl;
        }

        if (updateUrl) {
          const currentUrl = new URL(window.location);
          currentUrl.searchParams.set('flow', flow);
          window.history.replaceState({}, '', currentUrl.toString());
        }
      }

      // Check URL search parameters on initial load
      const urlParams = new URLSearchParams(window.location.search);
      const initialFlow = urlParams.get('flow') || 'home';
      setFlow(initialFlow, false);

      // Add click listeners to switcher pills
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          const flow = pill.getAttribute('data-flow');
          setFlow(flow, true);
        });
      });

      // Reload iframe button
      if (btnReload) {
        btnReload.addEventListener('click', () => {
          iframe.src = iframe.src;
        });
      }

      // Height-Adaptive Auto-Resizing: Ensure phone chassis unconditionally fits within viewport height
      function updateDeviceScale() {
        if (window.innerWidth <= 768) {
          document.documentElement.style.setProperty('--device-scale', '1');
          return;
        }
        const stage = document.querySelector('.device-stage');
        if (!stage) return;

        const stageH = stage.clientHeight || (window.innerHeight - 56);
        const stageW = stage.clientWidth || window.innerWidth;

        const chassisH = 866; // 844px screen + 22px border
        const chassisW = 412; // 390px screen + 22px border

        // Reserve vertical margin for stage breathing room & bottom caption hint
        const verticalMargin = stageH < 650 ? 24 : 52;
        const horizontalMargin = 32;

        const availableH = Math.max(160, stageH - verticalMargin);
        const availableW = Math.max(160, stageW - horizontalMargin);

        const scaleH = availableH / chassisH;
        const scaleW = availableW / chassisW;

        // Unconditionally fit within available viewport height & width
        const fitScale = Math.min(1.0, Math.min(scaleH, scaleW));
        document.documentElement.style.setProperty('--device-scale', fitScale.toFixed(4));
      }

      // Live Status Bar Clock
      function updateStatusBarTime() {
        const timeEl = document.getElementById('status-live-time');
        if (!timeEl) return;
        const now = new Date();
        let h = now.getHours();
        let m = now.getMinutes();
        timeEl.textContent = `${h}:${m < 10 ? '0' : ''}${m}`;
      }

      // Initial execution & Event binding
      updateStatusBarTime();
      updateDeviceScale();
      setInterval(updateStatusBarTime, 10000);

      window.addEventListener('resize', updateDeviceScale, { passive: true });
      window.addEventListener('orientationchange', updateDeviceScale, { passive: true });
      window.addEventListener('load', updateDeviceScale);

      if (window.ResizeObserver) {
        const stageEl = document.querySelector('.device-stage');
        if (stageEl) {
          new ResizeObserver(() => updateDeviceScale()).observe(stageEl);
        }
      }
    })();
  </script>
</body>
</html>
